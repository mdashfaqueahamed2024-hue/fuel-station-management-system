services:
  - type: web
    name: petroflow-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install && npx prisma generate && npm run prisma:push && node prisma/seed.js
    startCommand: node src/server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: petroflow-db
          property: connectionString

databases:
  - name: petroflow-db
    plan: free
    databaseName: fuel_station
    user: petroflow_admin
